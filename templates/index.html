<!DOCTYPE html>
<html>
<head>
    <title>My Scratch Page</title>
</head>
<body>
    <h1>Welcome to My Scratch Page</h1>

    <p>By Henry Lim — <a href="https://www.linkedin.com/in/henry-lim-15636212b">LinkedIn</a></p>
    <p><a href="{{ url_for('portfolio') }}">View my Portfolio →</a></p>

    {% if current_user.is_authenticated %}
        <p><a href="{{ url_for('logout') }}">Log out</a></p>
    {% else %}
        <p><a href="{{ url_for('login') }}">Log in</a></p>
    {% endif %}

    <h2>Comments</h2>
    {% for comment in comments %}
        <p>{{ comment.content }}</p>
    {% endfor %}

    {% if current_user.is_authenticated %}
        <form action="{{ url_for('add') }}" method="post">
            <input name="contents" placeholder="Add a comment">
            <input type="submit" value="Add">
        </form>
    {% endif %}
</body>
</html>
